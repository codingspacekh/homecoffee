name: App builds

# Store builds of the app. Runs when you start it by hand (Actions > App builds
# > Run workflow), when you push a tag such as app-v1.0.0, and on pull requests
# that change the Android or iOS setup. See apps/mobile/RELEASE.md.
on:
  workflow_dispatch:
  push:
    tags: ['app-v*']
  pull_request:
    paths:
      - 'apps/mobile/android/**'
      - 'apps/mobile/ios/**'
      - 'apps/mobile/pubspec.yaml'
      - '.github/workflows/app-builds.yml'

concurrency:
  group: app-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  android:
    name: Android (Google Play bundle and an APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Server address
        env:
          API_URL: ${{ vars.API_URL }}
          REVERB_URL: ${{ vars.REVERB_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            jq -n --arg api "$API_URL" --arg ws "$REVERB_URL" '{API_URL: $api, REVERB_URL: $ws}' > config/production.json
          else
            echo "::notice::No API_URL variable yet, so this build uses the example server address."
            cp config/production.example.json config/production.json
          fi
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::No upload key in the repository secrets, so this build is signed with a debug key. Google Play won't accept it."
            exit 0
          fi
          echo "$KEYSTORE" | base64 --decode > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      # Every run gets a higher build number, which Google Play requires
      - run: flutter build appbundle --release --dart-define-from-file=config/production.json --build-number=${{ github.run_number }}
      - run: flutter build apk --release --dart-define-from-file=config/production.json --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: homecoffee-android-${{ github.run_number }}
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    name: iOS (builds without signing)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Server address
        env:
          API_URL: ${{ vars.API_URL }}
          REVERB_URL: ${{ vars.REVERB_URL }}
        run: |
          if [ -n "$API_URL" ]; then
            jq -n --arg api "$API_URL" --arg ws "$REVERB_URL" '{API_URL: $api, REVERB_URL: $ws}' > config/production.json
          else
            cp config/production.example.json config/production.json
          fi
      # Proves the iOS app builds. The signed build for TestFlight is made on
      # a Mac with your Apple account (apps/mobile/RELEASE.md).
      - run: flutter build ipa --release --no-codesign --dart-define-from-file=config/production.json --build-number=${{ github.run_number }}
