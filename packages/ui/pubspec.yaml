name: homecoffee_ui
description: HomeCoffee theme from the prototype's Foundations board, with bundled fonts.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Regular.ttf
          weight: 400
        - asset: fonts/Figtree-Medium.ttf
          weight: 500
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
    - family: NotoSansKhmer
      fonts:
        - asset: fonts/NotoSansKhmer-Regular.ttf
          weight: 400
        - asset: fonts/NotoSansKhmer-Medium.ttf
          weight: 500
        - asset: fonts/NotoSansKhmer-SemiBold.ttf
          weight: 600
        - asset: fonts/NotoSansKhmer-Bold.ttf
          weight: 700
