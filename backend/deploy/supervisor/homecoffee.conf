; /etc/supervisor/conf.d/homecoffee.conf
; Keeps the queue worker (pushes, emails) and Reverb (live order status)
; running, and starts them again after a crash or a reboot.

[program:homecoffee-worker]
command=php /var/www/homecoffee/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=homecoffee
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/homecoffee/backend/storage/logs/worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

[program:homecoffee-reverb]
command=php /var/www/homecoffee/backend/artisan reverb:start --host=127.0.0.1 --port=8080
user=homecoffee
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
minfds=10000
redirect_stderr=true
stdout_logfile=/var/www/homecoffee/backend/storage/logs/reverb.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
