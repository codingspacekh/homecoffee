# /etc/nginx/sites-available/homecoffee
# One site serves the API (/api), the admin panel (/admin) and live order
# status (Reverb, /app). Replace homecoffee.example.com with your
# domain, then run certbot (see deploy/README.md), which fills in the
# certificate lines.

server {
    listen 80;
    listen [::]:80;
    server_name homecoffee.example.com;
    return 301 https://$host$request_uri;
}

server {
    # Ubuntu 24.04 ships nginx 1.24, which takes http2 on the listen line
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name homecoffee.example.com;

    root /var/www/homecoffee/backend/public;
    index index.php;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/homecoffee.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homecoffee.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Product photos uploaded in the admin panel
    client_max_body_size 10m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Live order status: the app's socket goes to Reverb on port 8080.
    # Laravel publishes to Reverb on 127.0.0.1 directly, not through here.
    location /app/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Cache photos and the admin panel's built files for a month
    location ~* \.(?:css|js|woff2|webp|png|jpg|svg)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
